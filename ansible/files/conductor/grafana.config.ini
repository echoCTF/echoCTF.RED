[paths]
data = /var/grafana
logs = /var/log/grafana
plugins = /var/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000

[security]
admin_user = {{grafana_user|default("admin")}}
admin_password = """{{grafana_password|default("admin")}}"""

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = file
