# Rate limit /api to 10 requests/sec
# This is way too loose
location /api {
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=Api;
    index  index.php;
    try_files $uri $uri/ /index.php$is_args$args;
}

